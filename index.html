<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5fb8ea">
<title>やりのぼり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div><span class="num" id="num">1</span><span class="unit">かい</span></div>
  <div class="best" id="bestHud">さいこう 0かい</div>
  <div class="coin"><span class="coin-ic"></span><span id="coinHud">0</span></div>
</div>

<div class="overlay" id="titleOv">
  <div class="card">
    <h1 class="title">やりのぼり</h1>
    <p class="sub">ピンポン玉をビルのてっぺんへ</p>
    <ul class="rules">
      <li>画面をタップすると、右のヤリが横にとんでビルにささる</li>
      <li>おちてきた玉がヤリにのると、はねて上へ</li>
      <li>とんでいるヤリが玉に当たったらまけ</li>
      <li>のぼったかいだけコインがもらえて、ガチャで玉が当たる</li>
    </ul>
    <button id="startBtn">はじめる</button>
    <button class="sub2" id="gachaBtn1">ガチャ</button>
  </div>
</div>

<div class="overlay hidden" id="overOv">
  <div class="card" style="text-align:center">
    <div id="newrec" class="newrec" hidden>しんきろく</div>
    <div class="result"><span id="resNum">1</span><small>かい</small></div>
    <p class="resbest" id="resBest">さいこう 0かい</p>
    <p class="earn"><span class="coin-ic"></span>+<span id="earnNum">0</span>コイン</p>
    <button id="againBtn">もういちど</button>
    <button class="sub2" id="gachaBtn2">ガチャ</button>
  </div>
</div>

<div class="overlay hidden" id="gachaOv">
  <div class="card gcard">
    <div class="ghead">
      <h2 class="gtitle">玉ガチャ</h2>
      <div class="coins"><span class="coin-ic"></span><span id="gCoins">0</span></div>
    </div>
    <canvas class="stage" id="gStage"></canvas>
    <p class="gmsg" id="gMsg">1かい 10コイン</p>
    <button id="pullBtn">ガチャをひく</button>
    <p class="glabel" id="gCount">あつめた玉</p>
    <div class="grid" id="grid"></div>
    <button class="sub2" id="backBtn">もどる</button>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
